name: CI Code Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '26']
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies (CVE Check)
        run: npm run audit:cve

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Detect Unused Code (Knip)
        run: npm run knip

      - name: Detect Circular Dependencies (Madge)
        run: npm run madge

      - name: Architecture Layer Check (Dependency Cruiser)
        run: npm run architecture-check

      - name: Security & Unit Tests
        run: npm test

      - name: Build Next.js
        run: npm run build
